<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nearby fuel stations</title><link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/style.css"></head>
<body>
<a class="skip" href="#map" data-i18n="skip">Skip to map</a>
<header><div class="brand"><span class="brand-mark" aria-hidden="true">F</span><h1 data-i18n="title">Nearby fuel stations</h1></div><div class="header-tools"><label class="language-control"><span data-i18n="language">Language</span><select id="language"><option value="en">English</option><option value="zh">中文</option><option value="fi">Suomi</option></select></label><button id="map-settings" class="quiet" data-i18n="mapSettings">Map settings</button><button id="source-button" class="quiet" data-i18n="sources">Sources</button></div></header>
<main>
<section class="search-controls" aria-label="Location search" data-i18n-aria="cityLabel">
<div class="location-controls"><div class="panel-heading"><h2 data-i18n="where">Where do you need fuel?</h2></div><button id="locate" class="primary" data-i18n="locate">Use my location</button></div>
<div class="position-controls"><form id="location-form"><label for="place-query" data-i18n="cityLabel">City or postal code</label><div class="location-input-row"><input id="place-query" type="search" maxlength="120" required autocomplete="off" placeholder="Helsinki or 00100" data-i18n-placeholder="cityPlaceholder"><button id="find-location" class="secondary" type="submit" data-i18n="findLocation">Find location</button></div><label for="place-country" class="sr-only" data-i18n="country">Search region</label><select id="place-country"><option value="fi" data-i18n="finland">Finland</option><option value="" data-i18n="worldwide">All countries</option></select></form><div id="location-results" class="location-results" aria-live="polite" hidden></div><div class="position-status"><strong id="location-label" data-i18n="unlocated">Choose a location</strong></div></div>
<div class="range-controls"><fieldset class="radii"><legend data-i18n="radius">Search radius</legend><div id="radii"><button data-radius="1">1 km</button><button data-radius="3" class="selected" aria-pressed="true">3 km</button><button data-radius="5">5 km</button><button data-radius="10">10 km</button><button data-radius="20">20 km</button><button data-radius="50">50 km</button></div></fieldset><button id="search-stores" class="secondary search-again" data-i18n="searchStores">Find nearby fuel stations</button></div>
</section>
<section class="workspace"><aside class="search-panel" data-i18n-aria="stores" aria-label="Nearby fuel stations"><div class="results-heading"><h2><span data-i18n="stores">Nearby fuel stations</span> <span id="count">—</span></h2></div><p id="query-status" role="status"></p><div id="store-list" class="store-list"></div></aside><section class="map-panel" data-i18n-aria="stores" aria-label="Fuel station map"><div id="map"></div><div class="map-badge"><span class="location-dot"></span><span data-i18n="searchCenter">Search area</span><strong id="radius-label">3 km</strong></div><div class="map-type-controls"><button id="road-map" data-i18n="roadMap" aria-pressed="true">Map</button><button id="satellite-map" data-i18n="satellite" aria-pressed="false">Satellite</button></div><div class="map-zoom-controls"><button id="zoom-in" data-i18n-aria="zoomIn" aria-label="Zoom in">+</button><button id="zoom-out" data-i18n-aria="zoomOut" aria-label="Zoom out">−</button></div><div class="map-legend"><span class="legend-neste" data-i18n="neste">Neste</span><span class="legend-st1" data-i18n="st1">St1 / Shell</span><span class="legend-abc" data-i18n="abc">ABC</span></div><button id="recenter" class="map-control" aria-label="Return to search area" data-i18n-aria="recenter">⌖</button></section></section>
<section class="prices-section station-section"><h2 id="station-title" data-i18n="stationPriceTitle">Station fuel prices</h2><div id="station-price-status" class="price-empty"></div></section>
<section class="prices-section"><div class="prices-header"><h2 id="prices-title" data-i18n="priceTitle">Finland fuel price averages</h2><button id="refresh-prices" class="secondary" data-i18n="refresh">Check official prices</button></div><p class="price-scope" data-i18n="scope"></p><div class="fuel-filters" aria-label="Fuel prices" data-i18n-aria="priceTitle"><button data-fuel="all" data-i18n="all" class="selected" aria-pressed="true">All</button><button data-fuel="petrol95" data-i18n="petrol95">Petrol 95 E10</button><button data-fuel="petrol98" data-i18n="petrol98">Petrol 98 E5</button><button data-fuel="diesel" data-i18n="diesel">Diesel</button><button data-fuel="compressedBiogas" data-i18n="compressedBiogas">Compressed biogas</button><button data-fuel="liquefiedBiogas" data-i18n="liquefiedBiogas">Liquefied biogas</button><button data-fuel="heatingOil" data-i18n="heatingOil">Light fuel oil</button></div><div id="price-grid" class="price-grid"></div></section>
</main>
<footer><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a></footer>
<dialog id="map-dialog"><form method="dialog"><button class="close-dialog" data-i18n-aria="close" aria-label="Close">×</button></form><h2 data-i18n="googleSettings">Google Maps settings</h2><p data-i18n="demoIntro"></p><ol class="map-guide"><li><a href="https://console.cloud.google.com/google/maps-hosted/tos?ref=https%3A%2F%2Fdevelopers.google.com%2Fmaps%2F" target="_blank" rel="noopener noreferrer" data-i18n="demoLink"></a>. <span data-i18n="demoStep"></span></li><li data-i18n="pasteStep"></li></ol><form id="google-config-form"><label for="google-key" data-i18n="apiKey"></label><input id="google-key" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="keyPlaceholder"><label for="google-map-id" data-i18n="mapId"></label><input id="google-map-id" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="mapIdPlaceholder"><label for="store-source" data-i18n="storeSource"></label><select id="store-source"><option value="osm" data-i18n="osmOption"></option><option value="google" data-i18n="googleOption"></option></select><button id="save-map-config" type="submit" class="primary" data-i18n="saveMap"></button></form><p id="map-config-status" role="status"></p><p data-i18n="keyNotice"></p><p><a href="https://developers.google.com/maps/documentation/javascript/demo-key" target="_blank" rel="noopener noreferrer" data-i18n="demoDocs"></a> · <a href="https://developers.google.com/maps/documentation/javascript/get-api-key" target="_blank" rel="noopener noreferrer" data-i18n="productionDocs"></a></p></dialog>
<dialog id="source-dialog"><form method="dialog"><button class="close-dialog" data-i18n-aria="close" aria-label="Close">×</button></form><h2 data-i18n="sourceTitle"></h2><p id="map-provider"></p><p data-i18n="sourceMap"></p><p data-i18n="sourcePrivacy"></p><p data-i18n="sourcePrices"></p><p data-i18n="sourceSchedule"></p><p id="updated-label"></p><p id="schedule-label"></p><div id="source-list"></div></dialog>
<div id="toast" class="toast" hidden role="status"></div><script src="/vendor/leaflet.js"></script><script type="module" src="/app.mjs"></script>
</body></html>
